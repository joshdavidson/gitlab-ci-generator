# GitHub Actions for the GitHub mirror (joshdavidson/gitlab-ci-generator).
#
# The canonical repo lives on GitLab (defiant/gitlab-ci-generator) and is
# push-mirrored here; .gitlab-ci.yml drives the GitLab side (test/build/
# containerize/GitLab Pages) and is untouched by this workflow. When the
# mirror pushes main (or a tag), this workflow lint+tests and builds once,
# then from that tested output:
#   - deploy:    publishes the static dist/ bundle to GitHub Pages (main only)
#                  https://joshdavidson.github.io/gitlab-ci-generator/
#   - container: builds the Dockerfile from dist/ + dist-server/ and pushes
#                to GHCR (main + tags, same tag scheme as the GitLab registry:
#                latest + 8-char short SHA)
#                  ghcr.io/joshdavidson/gitlab-ci-generator
#
# Pages serves only the static web UI; the image also serves the HTTP API.

name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: GitHub Actions) on first run so the
          # mirror needs no manual repo-settings step.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Hand the tested bundles to the container job — ship what was tested,
      # same as the GitLab container job reusing the build artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            dist-server
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  container:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          SHORT_SHA=${GITHUB_SHA::8}
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"
