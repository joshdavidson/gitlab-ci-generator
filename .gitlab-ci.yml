# GitLab CI for gitlab-ci-generator (React + Vite + TypeScript).
#
# Runner: SHELL executor (tags: [shell]) — NOT docker, so `image:` is unusable.
# Node.js is preinstalled on build01.
#
# Stages:
#   test  -> typecheck + unit tests (generator output validity)
#   build -> production bundle, kept as an artifact for 1 week
#
# Deploy: intentionally none for now. To publish via GitLab Pages, uncomment
# the `pages` job below and add `deploy` to the stages list.

stages:
  - test
  - build

# Run MR pipelines and default-branch/tag pipelines; skip everything else.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  tags: [shell]
  interruptible: true

# Cache the npm download cache between pipelines (npm ci wipes node_modules,
# so caching the download cache is what actually saves time).
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run test
  needs: []

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

