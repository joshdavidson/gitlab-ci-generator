# GitLab CI for gitlab-ci-generator (React + Vite + TypeScript).
#
# Runner: SHELL executor (tags: [shell]) — NOT docker, so `image:` is unusable.
# Node.js is preinstalled on build01.
#
# Stages:
#   security     -> shared gitleaks scan (BLOCKING), included from defiant/iac
#   test         -> typecheck + unit tests (generator output validity + API)
#   build        -> production bundle + API server bundle, artifacts for 1 week
#   containerize -> OCI image via rootless podman, pushed to this project's
#                   GitLab container registry (main + tags only)
#   deploy       -> publish the tested dist/ bundle to GitLab Pages (main only):
#                   http://defiant.pages.defiantlabs.cloud/gitlab-ci-generator

stages:
  - security
  - test
  - build
  - containerize
  - deploy

# Blocking gitleaks scan shared by the defiant repos (see ci/secret-detection.gitlab-ci.yml
# in defiant/iac): it fails an MR or push that adds a secret, before anything deploys.
include:
  - project: defiant/iac
    ref: main
    file: ci/secret-detection.gitlab-ci.yml

# Run MR pipelines and default-branch/tag pipelines; skip everything else.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  tags: [shell]
  interruptible: true

# build01 ships Node 18 system-wide, but the repo needs Node >=24 (package.json engines; Vite 8 /
# vitest 5 / rolldown use node:util styleText). Provision a pinned Node 24 under the runner user's home
# (cached across jobs, checksum-verified) instead of changing the shared host.
.node24:
  before_script:
    - |
      NODE_VER=v24.22.1
      NODE_DIR="$HOME/.cache/node-$NODE_VER-linux-x64"
      if [ ! -x "$NODE_DIR/bin/node" ]; then
        TMP=$(mktemp -d)
        curl -fsSL -o "$TMP/node.tar.xz" "https://nodejs.org/dist/$NODE_VER/node-$NODE_VER-linux-x64.tar.xz"
        curl -fsSL "https://nodejs.org/dist/$NODE_VER/SHASUMS256.txt" | grep " node-$NODE_VER-linux-x64.tar.xz\$" | sed "s|node-.*|node.tar.xz|" > "$TMP/sum"
        (cd "$TMP" && sha256sum -c sum)
        mkdir -p "$NODE_DIR" && tar -xJf "$TMP/node.tar.xz" -C "$NODE_DIR" --strip-components=1
        rm -rf "$TMP"
      fi
      export PATH="$NODE_DIR/bin:$PATH"
    - node -v

# Cache the npm download cache between pipelines (npm ci wipes node_modules,
# so caching the download cache is what actually saves time).
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  extends: .node24
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run test
  needs: []

build:
  extends: .node24
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build   # emits dist/ (SPA) and dist-server/ (API server)
  artifacts:
    paths:
      - dist/
      - dist-server/
    expire_in: 1 week

# Build the image from the prebuilt dist/ artifact and push to this project's
# GitLab container registry — same podman-on-shell-runner pattern as the
# mcp-servers repos. MR pipelines skip this; images publish only from main/tags.
container:
  stage: containerize
  needs: [build]        # reuse the tested dist/ artifact — ship what was built
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_JOB_TOKEN" | podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - podman build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - podman push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - podman push "$CI_REGISTRY_IMAGE:latest"

# Publish the tested dist/ bundle to GitLab Pages — same shell-runner pattern
# as defiant/docs and defiant/defiantlabs.io. Auto-deploys on merge to main.
pages:
  stage: deploy
  needs: [build]        # reuse the tested dist/ artifact — ship what was built
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - rm -rf public
    - cp -r dist public
  artifacts:
    paths:
      - public
