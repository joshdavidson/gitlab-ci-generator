# Serves the built Vite bundle. try_files falls back to index.html so the app
# still loads on a deep link if client-side routing is ever added.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
